<!DOCTYPE html>
<html lang="en">
  <head>

    <title>IIIT Bhagalpur — MITRA Campus Community & Student Portal</title>
    
    <!-- Meta Descriptions & Search Optimization -->
    <meta name="description" content="Official centralized portal for Indian Institute of Information Technology Bhagalpur students, faculty, and administration. Access academic materials, career paths, campus bookings, and student services." />
    <meta name="keywords" content="IIIT Bhagalpur, IIITBH, MITRA, Student Portal, Study Materials, Campus Booking, Engineering College, Bihar, Technical Education" />
    <meta name="author" content="Indian Institute of Information Technology Bhagalpur" />
    <meta name="theme-color" content="#0284c7" />
    <link rel="canonical" href="https://iiitbh.ac.in" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://iiitbh.ac.in/" />
    <meta property="og:site_name" content="IIIT Bhagalpur MITRA" />
    <meta property="og:title" content="IIIT Bhagalpur — MITRA Campus Community & Student Portal" />
    <meta property="og:description" content="Centralized digital ecosystem for students: Career guidance rooms, verified academic repository, real-time facility bookings, and transparent student representation." />
    <meta property="og:image" content="https://iiitbh.ac.in/images/iiitbh_academic.jpg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@iiitbhagalpur" />
    <meta name="twitter:title" content="IIIT Bhagalpur — MITRA Campus Community & Student Portal" />
    <meta name="twitter:description" content="Centralized digital ecosystem for students: Career guidance rooms, verified academic repository, and real-time facility bookings." />
    <meta name="twitter:image" content="https://iiitbh.ac.in/images/iiitbh_academic.jpg" />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Preconnect & Font Loading (LCP optimization) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Sabour Campus",
        "addressLocality": "Bhagalpur",

        "addressCountry": "IN"
      },
      "sameAs": [

        "https://www.linkedin.com/school/iiitbhagalpur"
      ],
